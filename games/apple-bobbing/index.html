<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Apple Bobbing</title>
    <meta name="description" content="Bob for apples in a witch's cauldron of real-time simulated water. Every apple you catch surfaces an IBM storage fact.">
    <meta name="keywords" content="arcade, storage, IBM, halloween, educational, webgl">
    <meta name="added" content="2026-09-03">
    <meta name="game-accent" content="#ff8a2a">
    <meta name="game-controls" content="Tap an apple, then pick the right answer before the timer runs out. Drag on the water to stir">
    <script type="module" crossorigin src="./assets/index-DhQy106O.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BIFKy3Fu.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="counter">
        <div id="pumpkin"><span id="caught-count">0</span></div>
        <div>
          <div id="counter-label">apples bobbed</div>
          <div id="counter-sub"><span id="facts-left">12</span> facts still lurking</div>
        </div>
      </div>
      <div id="attract" class="hidden">
        <div id="attract-copy">
          <div id="attract-kicker">The IBM Storage</div>
          <h1 id="attract-title">Apple Bobbing</h1>
          <p id="attract-blurb">Twelve apples, twelve facts about FlashSystem, Storage Scale, Defender, Ceph and tape. No wet hair required.</p>
        </div>
        <div id="attract-cta">Tap an apple to begin</div>
      </div>
      <div id="fps" class="hidden"></div>
      <a id="arcade-link" href="../../">&larr; Arcade</a>
    </div>
    <div id="backdrop" class="hidden"></div>
    <section id="quiz-card" class="sheet hidden" aria-live="polite">
      <div id="quiz-timer"><div id="quiz-bar"></div><span id="quiz-seconds">12</span></div>
      <div id="quiz-meta"><span id="quiz-category" class="pill"></span><span id="quiz-kicker">Answer right to bob the apple</span></div>
      <h2 id="quiz-prompt"></h2>
      <div id="quiz-answers">
        <button class="answer" type="button" data-index="0"></button>
        <button class="answer" type="button" data-index="1"></button>
        <button class="answer" type="button" data-index="2"></button>
        <button class="answer" type="button" data-index="3"></button>
      </div>
    </section>
    <section id="fact-card" class="sheet hidden" aria-live="polite">
      <div id="fact-meta">
        <span id="fact-category" class="pill"></span>
        <span id="fact-progress"></span>
      </div>
      <h2 id="fact-title"></h2>
      <p id="fact-body"></p>
      <button id="fact-dismiss" type="button">Keep bobbing</button>
    </section>
    <div id="error" class="hidden"></div>
  </body>
</html>
